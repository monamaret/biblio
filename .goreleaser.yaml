version: 2

project_name: biblio-cli

builds:
  - id: biblio-cli
    main: ./cmd/biblio-cli
    binary: biblio-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Stamps the release tag into the version `-v`/`--version` reports
    # (internal/cli.version) — without this, goreleaser-built binaries
    # report the source's "dev" default (issue #193). This is separate
    # from `go install .../biblio-cli@latest`'s version, which Go stamps
    # automatically via build info rather than ldflags.
    ldflags:
      - -s -w -X github.com/monamaret/biblio/internal/cli.version={{.Version}}

archives:
  - id: biblio-cli
    ids:
      - biblio-cli
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: monamaret
    name: biblio
