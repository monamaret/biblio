version: 2

project_name: biblio-cli

builds:
  - id: biblio-cli
    main: ./cmd/biblio-cli
    binary: biblio-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: biblio-cli
    ids:
      - biblio-cli
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: monamaret
    name: biblio
