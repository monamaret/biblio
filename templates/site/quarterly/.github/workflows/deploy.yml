name: Deploy

# Generated by biblio-cli. The entire create -> dev -> build -> deploy ->
# update lifecycle stays behind the biblio-cli surface (Principle III) — this
# workflow only ever invokes `biblio-cli build`/`biblio-cli deploy`, never
# raw `vite build`/`wrangler deploy` directly (research.md "Build/deploy
# command surface").

on:
  push:
    branches: [main]
  # Lets the Actions tab redeploy without a new commit (#218).
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: npm install

      - name: Install biblio-cli
        run: go install github.com/monamaret/biblio/cmd/biblio-cli@latest
        env:
          GOBIN: /usr/local/bin

      - name: Build
        run: biblio-cli build

      - name: Deploy
        run: biblio-cli deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
